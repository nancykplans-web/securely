/* ============================================================

const SUPABASE_STORAGE_KEY = "azele-supabase-config";

let supabaseClient = null;
let currentUser = null;
let authMode = "login";


function getSupabaseConfig() {
  try {
    const saved =
      localStorage.getItem(
        SUPABASE_STORAGE_KEY
      );

    if (!saved) {
      return null;
    }

    const config =
      JSON.parse(saved);

    if (
      !config ||
      typeof config.url !== "string" ||
      typeof config.key !== "string"
    ) {
      return null;
    }

    return config;

  } catch (error) {

    console.error(
      "AZÈLE: Could not read Supabase configuration.",
      error
    );

    return null;
  }
}


function isSupabaseConfigured() {

  const config =
    getSupabaseConfig();

  return Boolean(
    config &&
    config.url &&
    config.key &&
    config.url.startsWith("https://") &&
    config.key.length > 20
  );
}


function initializeSupabase() {

  const config =
    getSupabaseConfig();

  if (!config) {

    supabaseClient = null;

    console.warn(
      "AZÈLE: Supabase credentials are not configured."
    );

    return false;
  }


  try {

    if (
      !window.supabase ||
      typeof window.supabase.createClient !== "function"
    ) {

      console.error(
        "AZÈLE: Supabase library is unavailable."
      );

      supabaseClient = null;

      return false;
    }


    supabaseClient =
      window.supabase.createClient(
        config.url,
        config.key,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    attachAuthListener();

    console.log(
      "AZÈLE: Supabase initialized successfully."
    );

    return true;

  } catch (error) {

    console.error(
      "AZÈLE: Supabase initialization failed:",
      error
    );

    supabaseClient = null;

    return false;
  }
}


function saveSupabaseConfig(
  url,
  key
) {

  const cleanUrl =
    String(url || "")
      .trim()
      .replace(/\/+$/, "");

  const cleanKey =
    String(key || "")
      .trim();


  if (
    !cleanUrl ||
    !cleanUrl.startsWith("https://")
  ) {

    throw new Error(
      "Enter a valid Supabase Project URL."
    );
  }


  if (
    cleanUrl.includes("YOUR-PROJECT") ||
    cleanUrl.includes("PASTE_YOUR")
  ) {

    throw new Error(
      "Enter your real Supabase Project URL."
    );
  }


  if (
    !cleanKey ||
    cleanKey.length < 20
  ) {

    throw new Error(
      "Enter your Supabase Publishable or anon key."
    );
  }


  if (
    cleanKey.includes("YOUR_SUPABASE") ||
    cleanKey.includes("PASTE_YOUR")
  ) {

    throw new Error(
      "Enter your real Supabase Publishable or anon key."
    );
  }


  localStorage.setItem(
    SUPABASE_STORAGE_KEY,
    JSON.stringify({
      url: cleanUrl,
      key: cleanKey
    })
  );


  return initializeSupabase();
}


function clearSupabaseConfig() {

  localStorage.removeItem(
    SUPABASE_STORAGE_KEY
  );

  supabaseClient = null;
  currentUser = null;

  updateAuthUI(null);
}


/* Initialize immediately */

    "dark",
    "system"
  ];


  if (
    !validThemes.includes(theme)
  ) {

    theme = "system";
  }


  document.documentElement.dataset.theme =
    theme;


  localStorage.setItem(
    "azele-theme",
    theme
  );


  document
    .querySelectorAll(
      "[data-theme-choice]"
    )
    .forEach(
      (button) => {

        button.classList.toggle(
          "active",
          button.dataset.themeChoice === theme
        );

      }
    );
}

/* ============================================================

function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );

  if (!toast) return;

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      3200
    );
}


function getRiskLevel(score) {

  if (score >= 75) {
    return "low";
  }

  if (score >= 50) {
    return "medium";
  }

  return "high";
}


function getRiskLabel(level) {

  if (level === "low") {
    return "Low risk";
  }

  if (level === "medium") {
    return "Moderate risk";
  }

  return "High risk";
}

  section.scrollIntoView({

/* ============================================================

   ============================================================ */

function renderQuestion() {

  const question =
    questions[currentQuestion];

  const questionNumber =
    currentQuestion + 1;


  document.getElementById(
    "questionNumber"
  ).textContent =
    `Question ${questionNumber}`;


  document.getElementById(
    "questionText"
  ).textContent =
    question.text;


  const options =
    document.getElementById(
      "answerOptions"
    );

  options.innerHTML = "";


  question.answers.forEach(
    (answer, index) => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "answer-option";


      if (
        answers[currentQuestion] &&
        answers[currentQuestion].index === index
      ) {

        button.classList.add(
          "selected"
        );

      }


      button.innerHTML = `
        <span class="answer-label">
          ${escapeHtml(answer.label)}
        </span>

        <span class="answer-points">
          ${answer.points}/10
        </span>
      `;


      button.addEventListener(
        "click",
        () => {

          answers[currentQuestion] = {
            index,
            points:
              answer.points,
            label:
              answer.label
          };

          renderQuestion();

        }
      );


      options.appendChild(
        button
      );

    }
  );


  const percent =
    Math.round(
      (questionNumber /
        questions.length) *
      100
    );


  document.getElementById(
    "progressText"
  ).textContent =
    `Question ${questionNumber} of ${questions.length}`;


  document.getElementById(
    "progressPercent"
  ).textContent =
    `${percent}%`;


  document.getElementById(
    "progressFill"
  ).style.width =
    `${percent}%`;


  const previousBtn =
    document.getElementById(
      "previousBtn"
    );


  previousBtn.style.visibility =
    currentQuestion === 0
      ? "hidden"
      : "visible";


  const nextBtn =
    document.getElementById(
      "nextBtn"
    );


  nextBtn.textContent =
    currentQuestion ===
    questions.length - 1
      ? "Complete assessment"
      : "Continue";
}


/* ============================================================
   NEXT / PREVIOUS
   ============================================================ */

function nextQuestion() {

  if (
    !answers[currentQuestion]
  ) {

    showToast(
      "Please select an answer before continuing."
    );

    return;
  }


  if (
    currentQuestion <
    questions.length - 1
  ) {

    currentQuestion++;

    renderQuestion();


    window.scrollTo({
      top:
        document.getElementById(
          "assessment-section"
        ).offsetTop - 90,

      behavior:
        "smooth"
    });

    return;
  }


  completeAssessment();
}


function previousQuestion() {

  if (
    currentQuestion > 0
  ) {

    currentQuestion--;

    renderQuestion();

  }
}


/* ============================================================
   COMPLETE ASSESSMENT
   ============================================================ */

async function completeAssessment() {

  const totalPoints =
    answers.reduce(
      (sum, answer) =>
        sum +
        (
          answer
            ? answer.points
            : 0
        ),
      0
    );


  const score =
    Math.round(
      (totalPoints /
        (questions.length * 10)) *
      100
    );


  const riskLevel =
    getRiskLevel(score);


  showResults(
    score,
    riskLevel
  );


  await saveAssessment(
    score,
    riskLevel
  );
}


/* ============================================================
   RESULTS
   ============================================================ */

function showResults(

  riskLevel

  document.getElementById(
    "assessment-section"

    "none";


  document.getElementById(
    "results-section"

  document.getElementById(

    document.getElementById(
      "scoreCircle"
    );


  scoreCircle.style.setProperty(
    "--score-angle",
    `${score * 3.6}deg`
  );


  const badge =
    document.getElementById(
      "riskBadge"
    );


  badge.className =
    `risk-badge risk-${riskLevel}`;


  badge.textContent =
    getRiskLabel(
      riskLevel
    );


  let summary =
    "Your business has several important security gaps that should be prioritized.";


  if (score >= 75) {

    summary =
      "Your business demonstrates a strong security foundation, with a few areas that can still be strengthened.";

  } else if (score >= 50) {

    summary =
      "Your business has a reasonable foundation, but several important security gaps should be prioritized.";

  }


  document.getElementById(
    "resultSummary"
  ).textContent =
    summary;


  renderPriorityActions();


  document.getElementById(
    "saveStatus"
  ).textContent =
    currentUser
      ? "Saving assessment to your AZÈLE account..."
      : "Assessment completed. Log in to save your assessment to your AZÈLE account.";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* ============================================================
   DYNAMIC PRIORITY ACTIONS
   ============================================================ */

function renderPriorityActions() {

  const container =
    document.getElementById(
      "priorityList"
    );

  container.innerHTML =
    "";


  const priorityActions =
    [];


  answers.forEach(
    (answer, index) => {

      if (
        !answer ||
        answer.points >= 10
      ) {
        return;
      }


      const definition =
        riskDefinitions[
          questions[index].id
        ];


      if (!definition) {
        return;
      }


      const severity =
        answer.points === 0
          ? "high"
          : definition.severity;


      priorityActions.push({

        title:
          definition.title,

        description:
          definition.recommendation,

        severity

      });

    }
  );


  priorityActions.sort(
    (a, b) => {

      const weight = {
        high: 3,
        medium: 2,
        low: 1
      };


      return (
        weight[b.severity] -
        weight[a.severity]
      );

    }
  );


  const visibleActions =
    priorityActions.slice(
      0,
      5
    );


  if (
    visibleActions.length === 0
  ) {

    container.innerHTML = `
      <div class="priority-item">
        <div class="priority-number">✓</div>

        <div>
          <strong>
            No immediate gaps identified
          </strong>

          <p>
            Your answers indicate that the assessed controls are currently
            in good shape. Continue reviewing them regularly.
          </p>
        </div>
      </div>
    `;

    return;
  }


  visibleActions.forEach(
    (action, index) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "priority-item";


      item.innerHTML = `
        <div class="priority-number">
          ${index + 1}
        </div>

        <div>
          <strong>
            ${escapeHtml(action.title)}
          </strong>

          <p>
            ${escapeHtml(action.description)}
          </p>

          <span class="priority-severity ${escapeHtml(action.severity)}">
            ${escapeHtml(action.severity)} priority
          </span>
        </div>
      `;


      container.appendChild(
        item
      );

    }
  );
}


/* ============================================================
   SUPABASE SAVE
   ============================================================ */

async function saveAssessment(
  score,
  riskLevel
) {

  if (!supabaseClient) {

    document.getElementById(
      "saveStatus"
    ).innerHTML =
      `
        Assessment completed.
        <strong>Connect Supabase to save this assessment.</strong>
      `;

    return;
  }


  if (!currentUser) {

    document.getElementById(
      "saveStatus"
    ).textContent =
      "Assessment completed. Log in to save your assessment to your AZÈLE account.";

    return;
  }


  try {

    document.getElementById(
      "saveStatus"
    ).textContent =
      "Saving assessment to your AZÈLE account...";


    const businessName =
      localStorage.getItem(
        "azele-business-name"
      ) ||
      "My Business";


    const industry =
      localStorage.getItem(
        "azele-industry"
      ) ||
      "General";


    /* BUSINESS */

    const {
      data: business,
      error: businessError
    } =
      await supabaseClient
        .from("businesses")
        .insert({

          user_id:
            currentUser.id,

          business_name:
            businessName,

          industry:
            industry

        })
        .select()
        .single();


    if (businessError) {
      throw businessError;
    }


    /* ASSESSMENT */

    const {
      data: assessment,
      error: assessmentError
    } =
      await supabaseClient
        .from("assessments")
        .insert({

          business_id:
            business.id,

          score:
            score,

          risk_level:
            String(riskLevel)
              .trim()
              .toLowerCase(),

          completed_at:
            new Date().toISOString()

        })
        .select()
        .single();


    if (assessmentError) {
      throw assessmentError;
    }


    /* ANSWERS */

    const answerRows =
      answers.map(
        (answer, index) => ({

          assessment_id:
            assessment.id,

          question_id:
            questions[index].id,

          answer:
            answer
              ? answer.label
              : "",

          points:
            answer
              ? answer.points
              : 0

        })
      );


    const {
      error: answersError
    } =
      await supabaseClient
        .from("assessment_answers")
        .insert(
          answerRows
        );


    if (answersError) {
      throw answersError;
    }


    /* RISKS */

    const riskRows = [];


    answers.forEach(
      (answer, index) => {

        if (
          !answer ||
          answer.points >= 10
        ) {
          return;
        }


        const definition =
          riskDefinitions[
            questions[index].id
          ];


        if (!definition) {
          return;
        }


        const normalizedSeverity =
          String(
            answer.points === 0
              ? "high"
              : definition.severity
          )
            .trim()
            .toLowerCase();


        const allowedSeverities = [
          "low",
          "medium",
          "high"
        ];


        if (
          !allowedSeverities.includes(
            normalizedSeverity
          )
        ) {

          throw new Error(
            "Invalid risk severity generated: " +
            normalizedSeverity
          );

        }


        riskRows.push({

          assessment_id:
            assessment.id,

          title:
            definition.title,

          description:
            definition.description,

          severity:
            normalizedSeverity,

          recommendation:
            definition.recommendation

        });

      }
    );


    if (
      riskRows.length > 0
    ) {

      const {
        error: risksError
      } =
        await supabaseClient
          .from("risks")
          .insert(
            riskRows
          );


      if (risksError) {
        throw risksError;
      }
    }


    /* ACTIONS */

    const actionRows =
      answers
        .map(
          (answer, index) => {

            if (
              !answer ||
              answer.points >= 10
            ) {
              return null;
            }


            const definition =
              riskDefinitions[
                questions[index].id
              ];


            if (!definition) {
              return null;
            }


            const priority =
              answer.points === 0
                ? "high"
                : definition.severity;


            return {

              assessment_id:
                assessment.id,

              title:
                definition.title,

              description:
                definition.recommendation,

              priority:
                String(priority)
                  .trim()
                  .toLowerCase(),

              completed:
                false

            };

          }
        )
        .filter(Boolean);


    if (
      actionRows.length > 0
    ) {

      const {
        error: actionsError
      } =
        await supabaseClient
          .from("actions")
          .insert(
            actionRows
          );


      if (actionsError) {
        throw actionsError;
      }
    }


    document.getElementById(
      "saveStatus"
    ).textContent =
      "Assessment saved to your AZÈLE account.";


    showToast(
      "Assessment saved successfully."
    );


  } catch (error) {

    console.error(
      "Assessment save error:",
      error
    );


    console.error(
      "Supabase details:",
      error?.message,
      error?.code,
      error?.details,
      error?.hint
    );


    document.getElementById(
      "saveStatus"
    ).textContent =
      "Save failed: " +
      (
        error?.message ||
        "Unknown database error."
      );
  }
}

/* ============================================================
   AUTH
   ============================================================ */

async function handleAuth(event) {

  event.preventDefault();


  const status =
    document.getElementById(
      "authStatus"
    );


  if (!supabaseClient) {

    closeAuthModal();

    openSupabaseSetup();

    return;
  }


  const email =
    document.getElementById(
      "authEmail"
    ).value
      .trim()
      .toLowerCase();


  const password =
    document.getElementById(
      "authPassword"
    ).value;


  const businessName =
    document.getElementById(
      "businessName"
    ).value
      .trim();


  if (
    !email ||
    !password
  ) {

    status.textContent =
      "Please enter your email and password.";

    return;
  }


  if (
    password.length < 6
  ) {

    status.textContent =
      "Your password must be at least 6 characters.";

    return;
  }


  status.textContent =
    authMode === "signup"
      ? "Creating your account..."
      : "Logging you in...";


  try {

    if (
      authMode === "signup"
    ) {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signUp({

            email,
            password

          });


      if (error) {
        throw error;
      }


      if (businessName) {

        localStorage.setItem(
          "azele-business-name",
          businessName
        );

      }


      if (
        data?.session
      ) {

        currentUser =
          data.user || null;


        status.textContent =
          "Account created successfully.";


        updateAuthUI(
          currentUser
        );


        setTimeout(
          closeAuthModal,
          500
        );

      } else {

        status.textContent =
          "Account created. Check your email to confirm your account.";

      }

    } else {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email,
            password

          });


      if (error) {
        throw error;
      }


      currentUser =
        data?.user || null;


      updateAuthUI(
        currentUser
      );


      status.textContent =
        "Logged in successfully.";


      setTimeout(
        closeAuthModal,
        300
      );
    }


    await loadCurrentUser();


  } catch (error) {

    console.error(
      "Authentication error:",
      error
    );


    let message =
      error?.message ||
      "Authentication failed.";


    const lower =
      message.toLowerCase();


    if (
      lower.includes(
        "invalid login credentials"
      )
    ) {

      message =
        "Incorrect email or password.";

    } else if (
      lower.includes(
        "email not confirmed"
      )
    ) {

      message =
        "Please confirm your email before signing in.";

    } else if (
      lower.includes(
        "already registered"
      )
    ) {

      message =
        "An account with this email already exists. Try logging in.";

    }


    status.textContent =
      message;
  }
}


/* ============================================================
   LOAD CURRENT USER
   ============================================================ */

async function loadCurrentUser() {

  if (!supabaseClient) {

    currentUser =
      null;

    updateAuthUI(
      null
    );

    return null;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .getUser();


    if (error) {

      /*
       * "Auth session missing" is normal when
       * nobody is logged in.
       */

      if (
        !String(
          error.message || ""
        )
          .toLowerCase()
          .includes(
            "auth session missing"
          )
      ) {

        console.error(
          "User loading error:",
          error
        );

      }


      currentUser =
        null;

      updateAuthUI(
        null
      );

      return null;
    }


    currentUser =
      data?.user || null;


    updateAuthUI(
      currentUser
    );


    return currentUser;


  } catch (error) {

    console.error(
      "User loading error:",
      error
    );


    currentUser =
      null;


    updateAuthUI(
      null
    );


    return null;
  }
}

   AUTH LISTENER
   ============================================================ */

function attachAuthListener() {

  if (
    !supabaseClient
  ) {
    return;
  }


  if (
    window.__azeleAuthSubscription
  ) {

    try {

      window.__azeleAuthSubscription.unsubscribe();

    } catch (_) {}

  }


  const {
    data
  } =
    supabaseClient.auth.onAuthStateChange(
      (_event, session) => {

        currentUser =
          session?.user || null;


        updateAuthUI(
          currentUser
        );

      }
    );


  window.__azeleAuthSubscription =
    data?.subscription || null;
}

/* ============================================================
   SCAM DETECTOR
   ============================================================ */

function checkScam() {

  const input =
    document.getElementById(
      "scamInput"
    );


  const result =
    document.getElementById(
      "scamResult"
    );


  const text =
    input.value.trim();


  if (!text) {

    result.className =
      "checker-result show warning";


    result.innerHTML =
      "<strong>Add a message first.</strong><br>Paste the non-sensitive parts of the suspicious message so AZÈLE can check common warning signs.";

    return;
  }


  const lower =
    text.toLowerCase();


  const signals = [];


  const urgencyPatterns = [
    "urgent",
    "immediately",
    "act now",
    "within 24 hours",
    "expires today",
    "final warning",
    "account will be closed"
  ];


  const credentialPatterns = [
    "password",
    "verification code",
    "security code",
    "login",
    "sign in",
    "verify your account",
    "confirm your identity"
  ];


  const paymentPatterns = [
    "gift card",
    "wire transfer",
    "send money",
    "payment required",
    "crypto",
    "bitcoin",
    "bank transfer"
  ];


  const linkPatterns = [
    "http://",
    "https://",
    "bit.ly/",
    "tinyurl.com/",
    "click here",
    "click the link"
  ];


  urgencyPatterns.forEach(
    (pattern) => {

      if (
        lower.includes(pattern)
      ) {

        signals.push(
          "Creates urgency or pressure"
        );

      }

    }
  );


  credentialPatterns.forEach(
    (pattern) => {

      if (
        lower.includes(pattern)
      ) {

        signals.push(
          "Requests or discusses account credentials"
        );

      }

    }
  );


  paymentPatterns.forEach(
    (pattern) => {

      if (
        lower.includes(pattern)
      ) {

        signals.push(
          "Contains payment or money-related pressure"
        );

      }

    }
  );


  linkPatterns.forEach(
    (pattern) => {

      if (
        lower.includes(pattern)
      ) {

        signals.push(
          "Contains a link or encourages clicking"
        );

      }

    }
  );


  const uniqueSignals =
    [...new Set(signals)];


  if (
    uniqueSignals.length >= 3
  ) {

    result.className =
      "checker-result show danger";


    result.innerHTML = `
      <strong>
        High number of warning signs detected.
      </strong>

      <br><br>

      ${uniqueSignals
        .map(
          signal =>
            "• " +
            escapeHtml(signal)
        )
        .join("<br>")}

      <br><br>

      <strong>
        Safer move:
      </strong>

      Do not click links, provide credentials, or send money.
      Verify the request independently through a trusted channel.
    `;


    return;
  }


  if (
    uniqueSignals.length >= 1
  ) {

    result.className =
      "checker-result show warning";


    result.innerHTML = `
      <strong>
        Some warning signs detected.
      </strong>

      <br><br>

      ${uniqueSignals
        .map(
          signal =>
            "• " +
            escapeHtml(signal)
        )
        .join("<br>")}

      <br><br>

      This does not prove the message is a scam.
      Verify the sender independently before taking action.
    `;


    return;
  }


  result.className =
    "checker-result show safe";


  result.innerHTML = `
    <strong>
      No obvious warning patterns detected.
    </strong>

    <br><br>

    That does not guarantee the message is legitimate.
    Be cautious with unexpected requests, links, attachments,
    payments, or login prompts.
  `;
}


function clearScamChecker() {

  document.getElementById(
    "scamInput"
  ).value =
    "";


  const result =
    document.getElementById(
      "scamResult"
    );


  result.className =
    "checker-result";


  result.innerHTML =
    "";
}


/* ============================================================
   PRIVACY COACH
   ============================================================ */

document
  .querySelectorAll(
    ".privacy-item"
  )
  .forEach(
    (checkbox) => {

      checkbox.addEventListener(
        "change",
        updatePrivacyScore
      );

    }
  );


function updatePrivacyScore() {

  const items =
    document.querySelectorAll(
      ".privacy-item"
    );


  const checked =
    document.querySelectorAll(
      ".privacy-item:checked"
    ).length;


  const total =
    items.length;


  const score =
    total
      ? Math.round(
          (checked / total) *
          100
        )
      : 0;


  const output =
    document.getElementById(
      "privacyScore"
    );


  if (
    checked === 0
  ) {

    output.innerHTML =
      "Select the statements that are true for you.";

    return;
  }


  let message =
    "";


  if (
    score < 50
  ) {

    message =
      "Your current checklist suggests several areas deserve attention. Start with MFA, unique passwords, updates, backups, and careful handling of sensitive information.";

  } else if (
    score < 84
  ) {

    message =
      "You have a reasonable foundation. Focus on the unchecked areas first, especially protections around accounts and sensitive information.";

  } else {

    message =
      "Strong checklist result. Keep reviewing these practices because security changes as accounts, people, and technology change.";

  }


  output.innerHTML =
    `<strong>${score}% coverage</strong><br>${escapeHtml(message)}`;
}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(
  value
) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendAssistantMessage();

      }

    }
  );


/* ============================================================
   MODAL BEHAVIOR
   ============================================================ */

document
  .getElementById(
    "authModal"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeAuthModal();

      }

    }
  );


document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closeAuthModal();
      closeSupabaseSetup();

    }

  }
);


/* ============================================================
   INITIALIZE AZÈLE
   ============================================================ */

initializeSupabase();

updateAuthUI(
  null
);

loadCurrentUser();

</script>
